<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>No AI Feed</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <button id="languageToggle" class="language-button" type="button" aria-label="Switch language">AR</button>
      <div class="brand" aria-label="No AI Feed">
        <h1>No AI Feed</h1>
      </div>
      <label class="master-switch" aria-label="Turn No AI Feed on or off">
        <input id="enabled" type="checkbox" />
        <span class="master-track"><span class="master-thumb"></span></span>
      </label>
    </header>

    <section id="primaryView" class="view primary-view">
      <div class="site-status" aria-live="polite">
        <div id="platformMark" class="platform-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" /><path d="M13 8.5h2V6h-2c-2.2 0-3.5 1.3-3.5 3.6V11H7v3h2.5v4H13v-4h2.5l.5-3H13V9.8c0-.8.3-1.3 1-1.3Z" /></svg>
        </div>
        <div class="site-copy">
          <strong id="connectionPlatform">Facebook</strong>
          <span class="site-divider"></span>
          <span id="connectionDot" class="connection-dot checking"></span>
          <span id="connectionDetail" class="connection-detail" data-i18n="checkingTab">Checking current tab…</span>
        </div>
        <button id="rescan" class="icon-button" type="button" data-i18n-aria="rescan" title="Rescan page">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 11a8 8 0 1 0 2 5.25" /><path d="M20 4v7h-7" /></svg>
        </button>
      </div>

      <section class="panel ai-panel">
        <div class="section-title">
          <span class="lang-en">Filter strength</span>
          <span class="lang-ar">قوة الفلترة</span>
        </div>
        <div id="keywordControls" class="mode-grid" role="radiogroup" aria-label="AI filter strength">
          <button class="mode-option" type="button" data-level="2" role="radio" aria-checked="false">
            <span class="mode-title" data-i18n="focused">Focused</span>
          </button>
          <button class="mode-option" type="button" data-level="4" role="radio" aria-checked="true">
            <span class="mode-title" data-i18n="balanced">Balanced</span>
          </button>
          <button class="mode-option" type="button" data-level="5" role="radio" aria-checked="false">
            <span class="mode-title" data-i18n="aggressive">Aggressive</span>
          </button>
        </div>
        <input id="keywordSensitivity" type="range" min="1" max="5" step="1" hidden />
        <output id="keywordSensitivityValue" hidden></output>
        <p id="keywordHint" hidden></p>
      </section>

      <section class="panel filters-panel">
        <div class="filters-head">
          <div class="filters-title">
            <h2 data-i18n="myFilters">My Filters</h2>
            <span id="ruleCount" class="count-pill">0 rules</span>
          </div>
          <button id="manageFilters" class="manage-button" type="button">
            <span data-i18n="manage">Manage</span>
            <svg viewBox="0 0 24 24" fill="none"><path d="m9 18 6-6-6-6" /></svg>
          </button>
        </div>

        <div class="quick-add">
          <input id="ruleValue" type="text" autocomplete="off" maxlength="160" data-i18n-placeholder="quickAddPlaceholder" placeholder="Add a topic, keyword, or creator…" />
          <button id="addRule" class="add-button" type="button" data-i18n-aria="addFilter" title="Add filter">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          </button>
        </div>
        <select id="ruleType" aria-label="Filter type" hidden>
          <option value="topic" data-i18n="topicPhrase">Topic / phrase</option>
          <option value="source" data-i18n="creatorSource">Creator / page / channel</option>
        </select>
        <p id="ruleHelp" hidden></p>
        <button id="quickBlockSource" class="quick-source" type="button" hidden><span id="quickBlockText"></span></button>
        <div id="rulePreviewList" class="rule-preview-list"></div>
      </section>

      <section class="panel behavior-panel">
        <div class="section-title" data-i18n="whenMatched">When something matches</div>
        <div class="segmented" role="group" aria-label="Filter behavior">
          <label>
            <input type="radio" name="behavior" value="blur" />
            <span><svg viewBox="0 0 24 24" fill="none"><path d="M4 8h16M6 12h12M8 16h8" /></svg><b data-i18n="blur">Blur</b></span>
          </label>
          <label>
            <input type="radio" name="behavior" value="remove" />
            <span><svg viewBox="0 0 24 24" fill="none"><path d="M4 12h16" /></svg><b data-i18n="hideCompletely">Hide completely</b></span>
          </label>
        </div>
        <label class="reason-toggle">
          <input id="showReason" type="checkbox" />
          <span class="reason-check" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="m5 12 4 4L19 6" /></svg></span>
          <span class="lang-en">Explain filtered content</span>
          <span class="lang-ar">وضّح سبب فلترة المحتوى</span>
        </label>
      </section>

      <button id="openAdvancedSettings" class="advanced-entry" type="button">
        <span class="advanced-entry-main">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M8 14v6" /></svg>
          <span class="lang-en">Advanced settings</span>
          <span class="lang-ar">الإعدادات المتقدمة</span>
        </span>
        <svg class="row-chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
      </button>

      <footer class="utility-footer">
        <a class="utility-icon" href="https://github.com/Ibrahim-3d/No-AI-Feed" target="_blank" rel="noopener noreferrer" aria-label="GitHub" title="GitHub">
          <svg viewBox="0 0 24 24" fill="none"><path d="M9 19c-4 1.2-4-2-5-2m10 4v-3.1c0-.9.3-1.7.8-2.3 2.6-.3 5.2-1.3 5.2-5.7A4.5 4.5 0 0 0 18.8 7a4.2 4.2 0 0 0-.1-3S17.7 3.7 15 5a10.2 10.2 0 0 0-6 0C6.3 3.7 5.3 4 5.3 4a4.2 4.2 0 0 0-.1 3A4.5 4.5 0 0 0 4 9.9c0 4.4 2.6 5.4 5.2 5.7.5.6.8 1.4.8 2.3V21" /></svg>
        </a>
        <a class="utility-icon" href="https://github.com/Ibrahim-3d/No-AI-Feed/issues" target="_blank" rel="noopener noreferrer" aria-label="Feedback" title="Feedback">
          <svg viewBox="0 0 24 24" fill="none"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v8Z" /></svg>
        </a>
        <button id="supportButton" class="support-button" type="button">
          <svg viewBox="0 0 24 24" fill="none"><path d="M7 8h9v10a3 3 0 0 1-3 3h-3a3 3 0 0 1-3-3V8Z" /><path d="M16 10h1.5a2.5 2.5 0 0 1 0 5H16" /></svg>
          <span data-i18n="supportButton">Buy me a coffee</span>
        </button>
        <a class="utility-icon" href="https://github.com/Ibrahim-3d/No-AI-Feed/blob/main/PRIVACY.md" target="_blank" rel="noopener noreferrer" aria-label="Privacy" title="Privacy">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 3 5.5 5.5v5.2c0 4.1 2.55 7.9 6.5 10.3 3.95-2.4 6.5-6.2 6.5-10.3V5.5L12 3Z" /></svg>
        </a>
        <div class="local-status" aria-label="Local filtering" title="Local filtering">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3 5.5 5.5v5.2c0 4.1 2.55 7.9 6.5 10.3 3.95-2.4 6.5-6.2 6.5-10.3V5.5L12 3Z" /><path d="m9 12 2 2 4-4" /></svg>
          <span class="lang-en">Local filtering</span>
          <span class="lang-ar">فلترة محلية</span>
        </div>
      </footer>
    </section>

    <section id="manageView" class="view manage-view" hidden>
      <div class="manage-header">
        <button id="backToMain" class="back-button" type="button" data-i18n-aria="back"><svg viewBox="0 0 24 24" fill="none"><path d="m15 18-6-6 6-6" /></svg></button>
        <div><h2 data-i18n="manageFiltersTitle">Manage filters</h2><p data-i18n="manageFiltersDesc">Edit rules, exceptions, and advanced detection.</p></div>
      </div>

      <div class="manage-tabs" role="tablist">
        <button id="filtersTabButton" class="manage-tab active" type="button" role="tab" aria-selected="true" data-i18n="filtersTab">Filters</button>
        <button id="advancedTabButton" class="manage-tab" type="button" role="tab" aria-selected="false" data-i18n="advancedTab">Advanced</button>
      </div>

      <div id="filtersTabPanel" class="manage-panel" role="tabpanel">
        <div class="manage-builder">
          <select id="manageRuleType" aria-label="Filter type">
            <option value="topic" data-i18n="topicPhrase">Topic / phrase</option>
            <option value="source" data-i18n="creatorSource">Creator / page / channel</option>
          </select>
          <div class="manage-input-wrap"><input id="manageRuleValue" type="text" maxlength="160" autocomplete="off" /><button id="manageAddRule" class="add-button" type="button"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" /></svg></button></div>
        </div>
        <div id="ruleList" class="manage-rule-list"></div>
        <div class="pager"><button id="prevRules" type="button" data-i18n-aria="previous"><svg viewBox="0 0 24 24" fill="none"><path d="m15 18-6-6 6-6" /></svg></button><span id="rulesPage">1 / 1</span><button id="nextRules" type="button" data-i18n-aria="next"><svg viewBox="0 0 24 24" fill="none"><path d="m9 18 6-6-6-6" /></svg></button></div>
        <button id="quickBlockSourceManage" class="quick-source manage-quick-source" type="button" hidden><span id="quickBlockTextManage"></span></button>
        <label class="exceptions-field"><span data-i18n="exceptions">Exceptions</span><textarea id="excludedKeywords" rows="2" data-i18n-placeholder="exceptionsPlaceholder"></textarea><small data-i18n="exceptionsHelp">One phrase per line. Exceptions override built-in and personal filters.</small></label>
      </div>

      <div id="advancedTabPanel" class="manage-panel" role="tabpanel" hidden>
        <label class="advanced-row"><div><b data-i18n="aiFilter">AI Filter</b><span data-i18n="aiFilterDesc">Hide AI-generated content, tools, and signals.</span></div><input id="detectKeywords" type="checkbox" /></label>
        <label class="advanced-row"><div><b data-i18n="facebookLabels">Facebook AI labels</b><span data-i18n="facebookLabelsDesc">Uses labels such as “AI info” and “Made with AI”.</span></div><input id="detectLabels" type="checkbox" /></label>
        <label class="advanced-row"><div><b data-i18n="mediaMetadata">Media metadata</b><span data-i18n="mediaMetadataDesc">Checks supported Facebook media for AI provenance.</span></div><input id="detectMetadata" type="checkbox" /></label>
        <div id="metadataControls" class="advanced-slider"><div><label for="detectionSensitivity" data-i18n="metadataSensitivity">Metadata sensitivity</label><output id="detectionSensitivityValue">Recommended</output></div><input id="detectionSensitivity" class="range" type="range" min="1" max="5" step="1" /><p id="metadataHint" class="hint"></p></div>
        <div class="advanced-slider"><div><label for="keywordSensitivityAdvanced" data-i18n="aiCoverage">AI filter coverage</label><output id="keywordSensitivityAdvancedValue">Industry</output></div><input id="keywordSensitivityAdvanced" class="range" type="range" min="1" max="5" step="1" /></div>
        <div class="advanced-slider"><div><label for="blurStrength" data-i18n="blurStrength">Blur strength</label><output id="blurStrengthValue">14px</output></div><input id="blurStrength" class="range" type="range" min="2" max="40" step="1" /></div>
      </div>
    </section>

    <div id="status" class="toast" role="status" aria-live="polite"></div>
  </main>
  <script src="popup.js"></script>
  <script src="popup-ui.js"></script>
</body>
</html>
